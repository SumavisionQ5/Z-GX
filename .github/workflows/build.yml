name: Build Z-GX

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/extremscorner/libogc2:latest
      options: --user root

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      # ↓↓↓ devkitPro 关键环境变量（显式声明，避免依赖镜像 profile）↓↓↓
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      PORTLIBS: /opt/devkitpro/portlibs/ppc

    steps:
      - name: 检出源码（不自动拉子模块）
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 清理异常的 gitlink 占位目录
        run: |
          rm -rf deps/libchdr
          echo "已清理 deps/libchdr"

      - name: 安装缺失的编译依赖
        run: |
          dkp-pacman -Syu --noconfirm || true
          dkp-pacman -S --needed --noconfirm \
            ppc-libpng ppc-libpngu ppc-libfat ppc-wiiuse ppc-bte \
            ppc-lzma ppc-zstd ppc-flac ppc-zlib || true

      - name: 交叉编译并安装 libchdr（CHD 解压库）
        run: |
          set -e
          # ↓↓↓ 关键：把 devkitPPC 和 devkitPro 工具链加入 PATH ↓↓↓
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          echo "编译器路径: $(command -v powerpc-eabi-gcc)"

          echo "=== 拉取 libchdr 源码 ==="
          git clone --depth=1 https://github.com/rtissera/libchdr deps/libchdr
          cd deps/libchdr

          echo "=== 用 devkitPPC 编译所有源文件 ==="
          for f in src/*.c; do
            echo "编译 $f"
            powerpc-eabi-gcc -O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64 \
              -Iinclude -I/opt/devkitpro/portlibs/ppc/include \
              -c "$f" -o "$(basename "$f" .c).o"
          done

          echo "=== 打包静态库 ==="
          powerpc-eabi-ar rcs libchdr.a *.o

          echo "=== 安装到 portlibs ==="
          mkdir -p /opt/devkitpro/portlibs/ppc/include/libchdr
          cp include/libchdr/*.h /opt/devkitpro/portlibs/ppc/include/libchdr/
          cp libchdr.a /opt/devkitpro/portlibs/ppc/lib/
          echo "✅ libchdr 安装完成"

      - name: 编译 Z-GX
        run: |
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          make -j$(nproc)

      - name: 收集产物
        run: |
          mkdir -p dist
          cp -v *.dol *.elf dist/ 2>/dev/null || true
          cp -rv SetaGX dist/ 2>/dev/null || true
          cp -v README.md LICENSE* dist/ 2>/dev/null || true
          find dist -type f | sort

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ZGX-Wii-${{ github.sha }}
          path: dist/
          if-no-files-found: error