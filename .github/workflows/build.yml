name: Build Z-GX

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/extremscorner/libogc2:latest   # ← 关键：libogc2 专用镜像
      options: --user root

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: 检出源码（不自动拉子模块）
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 查看 .gitmodules 与 deps 目录
        run: |
          cat .gitmodules 2>/dev/null || echo "(没有 .gitmodules 文件)"
          ls -la deps/ 2>/dev/null || echo "(deps 目录不存在)"
          echo "=== 检查 libogc2 规则文件是否就位 ==="
          ls -la /opt/devkitpro/libogc2/wii_rules

      - name: 清理异常的 gitlink 占位目录
        run: |
          rm -rf deps/libchdr
          echo "已清理 deps/libchdr"

      - name: 安装可能缺失的编译依赖
        run: |
          dkp-pacman -Syu --noconfirm || true
          dkp-pacman -S --needed --noconfirm \
            ppc-libpng ppc-libpngu ppc-libfat ppc-wiiuse ppc-bte \
            ppc-libchdr ppc-lzma ppc-zstd || true

      - name: 编译
        run: |
          echo "开始编译..."
          make -j$(nproc)

      - name: 收集产物
        run: |
          mkdir -p dist
          cp -v *.dol *.elf dist/ 2>/dev/null || true
          cp -rv SetaGX dist/ 2>/dev/null || true
          cp -v README.md LICENSE* dist/ 2>/dev/null || true
          find dist -type f | sort

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ZGX-Wii-${{ github.sha }}
          path: dist/
          if-no-files-found: error