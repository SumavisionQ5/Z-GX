name: Build Z-GX

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:latest
      options: --user root

    env:
      # 忽略 Node 20 弃用警告（可选）
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

    steps:
      - name: 检出源码（不自动拉子模块，避免 .gitmodules 缺失报错）
        uses: actions/checkout@v4
        with:
          submodules: false        # ← 关键修改：之前是 recursive，现在改成 false

      - name: 查看 .gitmodules 与 deps 目录（调试用）
        run: |
          echo "=== .gitmodules 内容 ==="
          cat .gitmodules 2>/dev/null || echo "(没有 .gitmodules 文件)"
          echo "=== deps 目录 ==="
          ls -la deps/ 2>/dev/null || echo "(deps 目录不存在)"

      - name: 清理异常的 gitlink 占位目录
        run: |
          # deps/libchdr 在 .gitmodules 中没有 URL，无法作为子模块拉取。
          # checkout 后它只是一个空占位目录，直接移除，避免干扰编译。
          rm -rf deps/libchdr
          echo "已清理 deps/libchdr"
          ls -la deps/ 2>/dev/null || echo "(deps 目录已不存在)"

      - name: 安装可能缺失的编译依赖
        run: |
          dkp-pacman -Syu --noconfirm || true
          dkp-pacman -S --needed --noconfirm \
            ppc-libpng ppc-libpngu ppc-libfat ppc-wiiuse ppc-bte \
            ppc-libchdr ppc-lzma ppc-zstd || true

      - name: 编译
        run: |
          make -j$(nproc)

      - name: 收集产物
        run: |
          mkdir -p dist
          cp -v *.dol *.elf dist/ 2>/dev/null || true
          cp -rv SetaGX dist/ 2>/dev/null || true
          cp -v README.md LICENSE* dist/ 2>/dev/null || true
          find dist -type f | sort

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ZGX-Wii-${{ github.sha }}
          path: dist/
          if-no-files-found: error