name: Build Z-GX

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/extremscorner/libogc2:latest
      options: --user root

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
      DEVKITPRO: /opt/devkitpro
      DEVKITPPC: /opt/devkitpro/devkitPPC
      PORTLIBS: /opt/devkitpro/portlibs/ppc

    steps:
      - name: 检出源码（不自动拉子模块）
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: 清理异常的 gitlink 占位目录
        run: |
          rm -rf deps/libchdr
          echo "已清理 deps/libchdr"

      - name: 安装 devkitPro 官方依赖库
        run: |
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          dkp-pacman -Syu --noconfirm || true
          dkp-pacman -S --needed --noconfirm \
            ppc-libpng libfat-ogc ppc-wiiuse ppc-bte \
            ppc-lzma ppc-zstd ppc-flac ppc-zlib || true

      - name: 交叉编译并安装 libchdr（含 LZMA + miniz 依赖）
        run: |
          set -e
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          git clone --depth=1 https://github.com/rtissera/libchdr deps/libchdr
          cd deps/libchdr
          LZMA_DIR=$(find deps -maxdepth 1 -type d -name "lzma*" | head -1)
          MINIZ_DIR=$(find deps -maxdepth 1 -type d -name "miniz*" | head -1)
          COMMON="-O2 -D_LARGEFILE_SOURCE -D_FILE_OFFSET_BITS=64"
          INCS="-Iinclude -I/opt/devkitpro/portlibs/ppc/include \
                -I$LZMA_DIR/include -I$MINIZ_DIR"
          for f in src/*.c; do
            powerpc-eabi-gcc $COMMON $INCS -c "$f" -o "$(basename "$f" .c).o"
          done
          for f in $LZMA_DIR/src/LzmaDec.c $LZMA_DIR/src/Alloc.c; do
            [ -f "$f" ] || continue
            powerpc-eabi-gcc $COMMON -DZ7_ST $INCS -c "$f" -o "$(basename "$f" .c).o"
          done
          powerpc-eabi-gcc $COMMON $INCS -c $MINIZ_DIR/miniz.c -o miniz.o
          powerpc-eabi-ar rcs libchdr.a *.o
          mkdir -p /opt/devkitpro/portlibs/ppc/include/libchdr
          cp include/libchdr/*.h /opt/devkitpro/portlibs/ppc/include/libchdr/
          cp libchdr.a /opt/devkitpro/portlibs/ppc/lib/
          echo "✅ libchdr 安装完成"

      - name: 从 GRRLIB 源码交叉编译并安装 libpngu
        run: |
          set -e
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          git clone --depth=1 https://github.com/GRRLIB/GRRLIB /tmp/GRRLIB
          PNGU_DIR=$(find /tmp/GRRLIB -name "pngu.c" -printf "%h\n" | head -1)
          echo "libpngu 源码目录: $PNGU_DIR"
          cd "$PNGU_DIR"
          for f in *.c; do
            powerpc-eabi-gcc -O2 \
              -I/opt/devkitpro/portlibs/ppc/include \
              -I/opt/devkitpro/libogc2/wii/include \
              -c "$f" -o "$(basename "$f" .c).o"
          done
          powerpc-eabi-ar rcs libpngu.a *.o
          cp -v *.h /opt/devkitpro/portlibs/ppc/include/ 2>/dev/null || true
          cp -v libpngu.a /opt/devkitpro/portlibs/ppc/lib/
          echo "✅ libpngu 安装完成"

      - name: 编译 Z-GX
        run: |
          export PATH="/opt/devkitpro/devkitPPC/bin:/opt/devkitpro/tools/bin:$PATH"
          mkdir -p SetaGX          # ← 关键：Makefile 需要这个目录来放 boot.dol
          make -j$(nproc)

      - name: 收集产物
        run: |
          mkdir -p dist
          cp -v *.dol *.elf dist/ 2>/dev/null || true
          cp -rv SetaGX dist/ 2>/dev/null || true
          cp -v README.md LICENSE* dist/ 2>/dev/null || true
          echo "=== 最终产物 ==="
          find dist -type f | sort

      - name: 上传编译产物
        uses: actions/upload-artifact@v4
        with:
          name: ZGX-Wii-${{ github.sha }}
          path: dist/
          if-no-files-found: error